<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Accounts</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafafa;
      --text: #222;
      --muted: #656565;
      --line: #ddd;
      --accent: #246641;
      --field: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181818;
        --text: #eee;
        --muted: #aaa;
        --line: #383838;
        --accent: #8cceaa;
        --field: #222;
      }
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font:
        15px/1.5 system-ui,
        sans-serif;
    }
    main {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 24px;
    }
    header {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 auto 0 0;
    }
    button,
    input {
      font: inherit;
      color: inherit;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--field);
      padding: 8px 12px;
    }
    button {
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover {
      border-color: var(--muted);
    }
    button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    #login {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: end;
      max-width: 420px;
      margin: 60px auto;
    }
    #login label {
      display: grid;
      gap: 6px;
      flex: 1;
    }
    #login input {
      width: 100%;
      min-width: 140px;
    }
    #login button {
      min-height: 40px;
    }
    #notice:empty {
      display: none;
    }
    #notice {
      color: var(--muted);
      font-size: 14px;
    }
    #notice.error {
      color: #cf5147;
    }
    .row,
    .labels {
      display: grid;
      grid-template-columns: minmax(140px, 1.2fr) 1fr 1fr 130px;
      gap: 20px;
      align-items: center;
    }
    .row {
      padding: 20px 0;
      border-top: 1px solid var(--line);
    }
    .labels {
      color: var(--muted);
      font-size: 13px;
      padding-bottom: 8px;
    }
    .identity {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .name {
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    input[type='checkbox'] {
      width: 19px;
      height: 19px;
      margin: 0;
      accent-color: var(--accent);
      flex-shrink: 0;
    }
    small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }
    .quota {
      font-variant-numeric: tabular-nums;
    }
    .quota b {
      font-size: 17px;
      font-weight: 500;
    }
    .track {
      height: 3px;
      background: var(--line);
      margin: 6px 0;
      max-width: 170px;
    }
    .fill {
      display: block;
      height: 100%;
      background: var(--accent);
    }
    .resets {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .resets button {
      padding: 6px 9px;
      font-size: 13px;
      min-height: 36px;
    }
    [hidden] {
      display: none !important;
    }
    @media (max-width: 600px) {
      main {
        margin: 20px auto;
        padding: 0 18px;
      }
      .labels {
        display: none;
      }
      .row {
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .identity {
        grid-column: 1/-1;
      }
      .resets {
        grid-column: 1/-1;
        justify-content: space-between;
      }
      .quota:before {
        content: attr(data-label);
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 4px;
      }
      .track {
        max-width: none;
      }
      header {
        margin-bottom: 16px;
      }
      header h1 {
        font-size: 18px;
      }
      header button {
        font-size: 14px;
        padding: 8px;
      }
      .resets > span::after {
        content: ' banked resets';
        color: var(--muted);
        font-size: 12px;
      }
      #login {
        margin: 45px auto;
      }
    }
  </style>
  <main>
    <header>
      <h1 id="title">Accounts</h1>
      <button id="refresh" hidden>Refresh</button><button id="logout" hidden>Log out</button>
    </header>
    <form id="login" hidden>
      <label
        >Password<input
          id="password"
          type="password"
          autocomplete="current-password"
          required /></label
      ><button>Unlock</button>
    </form>
    <p id="notice" role="status" aria-live="polite"></p>
    <section id="content" aria-label="Accounts" hidden>
      <div class="labels" aria-hidden="true">
        <span>Account</span><span>5-hour remaining</span><span>Weekly remaining</span
        ><span>Banked resets</span>
      </div>
      <div id="accounts"></div>
    </section>
  </main>
  <script>
    'use strict';
    const q = (s) => document.querySelector(s),
      base = location.pathname.replace(/\/$/, ''),
      pending = new Map();
    q('#title').textContent = base.endsWith('/job') ? 'Job accounts' : 'Private accounts';
    function el(tag, text) {
      const n = document.createElement(tag);
      if (text !== undefined) n.textContent = text;
      return n;
    }
    function notice(text = '', error = false) {
      q('#notice').textContent = text;
      q('#notice').classList.toggle('error', error);
    }
    function unlocked(ok) {
      q('#login').hidden = ok;
      q('#content').hidden = !ok;
      q('#refresh').hidden = !ok;
      q('#logout').hidden = !ok;
    }
    async function api(path, method = 'GET', data) {
      const r = await fetch(base + path, {
        method,
        credentials: 'same-origin',
        cache: 'no-store',
        headers: data === undefined ? {} : { 'Content-Type': 'application/json' },
        body: data === undefined ? undefined : JSON.stringify(data),
      });
      const value = await r.json();
      if (!r.ok) {
        if (r.status === 401) unlocked(false);
        throw Error(value.error || 'Request failed');
      }
      return value;
    }
    function quota(w, label) {
      const cell = el('div');
      cell.className = 'quota';
      cell.dataset.label = label;
      if (!w) {
        cell.append(el('b', '—'), el('small', 'Unavailable'));
        return cell;
      }
      const left = Math.max(0, Math.min(100, 100 - w.used_percent));
      cell.append(el('b', Math.round(left) + '%'));
      const track = el('div'),
        fill = el('span');
      track.className = 'track';
      fill.className = 'fill';
      fill.style.width = left + '%';
      track.append(fill);
      cell.append(track);
      cell.setAttribute('aria-label', label + ': ' + Math.round(left) + '%');
      if (w.reset_at) {
        const reset = new Date(w.reset_at * 1000);
        cell.append(
          el(
            'small',
            reset > Date.now()
              ? 'Resets ' +
                  reset.toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' })
              : 'Window available'
          )
        );
      }
      return cell;
    }
    function limit(a, seconds) {
      return Object.values(a.quota?.rate_limit || {}).find(
        (w) => w?.limit_window_seconds === seconds
      );
    }
    function render(accounts) {
      const body = q('#accounts');
      body.replaceChildren();
      for (const a of accounts) {
        const row = el('div'),
          identity = el('div'),
          name = el('span'),
          toggle = el('input');
        row.className = 'row';
        identity.className = 'identity';
        name.className = 'name';
        name.textContent = a.email || a.provider;
        toggle.type = 'checkbox';
        toggle.checked = !a.disabled;
        toggle.title = 'Enable or disable ' + name.textContent;
        toggle.setAttribute('aria-label', 'Enable ' + name.textContent);
        toggle.onchange = async () => {
          toggle.disabled = true;
          try {
            await api('/api/account/status', 'POST', { id: a.id, disabled: !toggle.checked });
            await load();
          } catch (e) {
            toggle.checked = !toggle.checked;
            notice(e.message, true);
          } finally {
            toggle.disabled = false;
          }
        };
        identity.append(toggle, name);
        if (a.disabled) name.append(el('small', 'Disabled'));
        else if (a.quota_error) name.append(el('small', 'Quota unavailable'));
        row.append(
          identity,
          quota(limit(a, 18000), '5-hour remaining'),
          quota(limit(a, 604800), 'Weekly remaining')
        );
        const resets = el('div'),
          count = a.quota?.rate_limit_reset_credits?.available_count;
        resets.className = 'resets';
        const text = el('span', count === undefined ? '—' : String(count));
        text.title = 'Available banked resets';
        text.setAttribute(
          'aria-label',
          count === undefined ? 'Banked resets unavailable' : count + ' banked resets'
        );
        const use = el('button', 'Use reset');
        use.disabled = !(count > 0);
        use.title = 'Spend one banked reset for ' + name.textContent;
        use.onclick = async () => {
          if (!confirm('Use one banked reset for ' + (a.email || a.provider) + '?')) return;
          use.disabled = true;
          let requestID = pending.get(a.id) || sessionStorage.getItem('reset:' + base + ':' + a.id);
          if (!requestID) {
            requestID = crypto.randomUUID();
            sessionStorage.setItem('reset:' + base + ':' + a.id, requestID);
          }
          pending.set(a.id, requestID);
          try {
            const result = await api('/api/account/reset', 'POST', {
              id: a.id,
              request_id: requestID,
            });
            pending.delete(a.id);
            sessionStorage.removeItem('reset:' + base + ':' + a.id);
            notice(
              result.result === 'already_redeemed' ? 'Reset already applied.' : 'Reset applied.'
            );
            await load();
          } catch (e) {
            notice(
              e.message + ' Refresh before retrying; the same redemption ID will be reused.',
              true
            );
          } finally {
            use.disabled = false;
          }
        };
        resets.append(text, use);
        row.append(resets);
        body.append(row);
      }
      if (!accounts.length) body.append(el('p', 'No accounts connected.'));
    }
    async function load() {
      q('#refresh').disabled = true;
      try {
        render(await api('/api/accounts'));
        unlocked(true);
        return true;
      } catch (e) {
        if (e.message !== 'Password required') notice(e.message, true);
        return false;
      } finally {
        q('#refresh').disabled = false;
      }
    }
    q('#login').onsubmit = async (e) => {
      e.preventDefault();
      const button = q('#login button');
      button.disabled = true;
      notice();
      try {
        await api('/api/login', 'POST', { password: q('#password').value });
        q('#password').value = '';
        await load();
      } catch (e) {
        notice(e.message, true);
      } finally {
        button.disabled = false;
      }
    };
    q('#refresh').onclick = () => {
      notice();
      load();
    };
    q('#logout').onclick = async () => {
      try {
        await api('/api/logout', 'POST', {});
        q('#accounts').replaceChildren();
        unlocked(false);
        notice();
      } catch (e) {
        notice(e.message, true);
      }
    };
    load();
  </script>
</html>
